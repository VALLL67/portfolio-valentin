<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230A0B0D'/%3E%3Ctext x='50' y='68' font-family='monospace' font-size='52' font-weight='700' fill='%238B7CF6' text-anchor='middle'%3EVS%3C/text%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Valentin Stoll — Etudiant et apprenti en ingenierie des systemes d'information. Automatisation, supervision IoT, infrastructures securisees." />
    <meta name="theme-color" content="#0A0B0D" />

    <!-- Applique le theme AVANT le rendu pour eviter tout flash au chargement -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.classList.add(t);
          if (localStorage.getItem('crt') === '1') document.documentElement.classList.add('crt');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

    <!-- Polices auto-hébergées via @fontsource (aucune requête externe, conformité RGPD) -->

    <title>Valentin Stoll — Ingenierie des Systemes d'Information</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
