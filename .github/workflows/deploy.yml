# Déploiement automatique sur GitHub Pages à chaque push sur la branche main.
#
# ➜ Mise en route (une seule fois) :
#    1. Pousse ton projet sur GitHub.
#    2. Dépôt > Settings > Pages > "Build and deployment" > Source : "GitHub Actions".
#    3. À chaque push sur main, le site est rebuild et publié automatiquement.
#
# (Alternative manuelle sans Actions : `npm run deploy`, voir le README.)

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
